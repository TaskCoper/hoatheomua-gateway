# Standalone single-environment compose (base file).
# Use directly:           docker compose -f .docker/docker-compose.yml up -d
# Or layer an overlay:    docker compose -f .docker/docker-compose.yml -f .docker/compose.dev.yml up -d
#                         docker compose -f .docker/docker-compose.yml -f .docker/compose.prod.yml up -d
# For CI/CD the profile-based .docker/compose.yaml is used instead.
services:
  hoatheomua-gateway:
    build:
      context: ..
      dockerfile: HoaTheoMua.ApiGateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      # Logging
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning

      # JWT
      JwtOption__Issuer: ${JWT_ISSUER}
      JwtOption__Audience: ${JWT_AUDIENCE}
      JwtOption__SecretKey: ${JWT_SECRET}
      JwtOption__ExpireMin: ${JWT_EXPIRE_MIN:-5}

      # Reverse proxy routes
      ReverseProxy__Routes__ecommerceApiRoute__ClusterId: ecommerceApiCluster
      ReverseProxy__Routes__ecommerceApiRoute__Match__Path: ecommerce-api/{**catch-all}
      ReverseProxy__Routes__ecommerceApiRoute__Transforms__0__PathPattern: api/{**catch-all}

      ReverseProxy__Routes__taskcoperApiRoute__ClusterId: taskcoperApiCluster
      ReverseProxy__Routes__taskcoperApiRoute__Match__Path: taskcoper-api/{**catch-all}
      ReverseProxy__Routes__taskcoperApiRoute__Transforms__0__PathPattern: api/{**catch-all}

      # Reverse proxy clusters (backend addresses)
      ReverseProxy__Clusters__ecommerceApiCluster__Destinations__Destination1__Address: ${ADDRESS_ECOMMERCE}
      ReverseProxy__Clusters__taskcoperApiCluster__Destinations__Destination1__Address: ${ADDRESS_TASKCOPER}

      AllowedHosts: "*"
    networks:
      - hoatheomua-gateway-network

networks:
  hoatheomua-gateway-network:
    name: hoatheomua-gateway-network
    driver: bridge
    ipam:
      driver: default
